<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Quickly generate project ideas and names. Lightweight, responsive toy app to spark creativity." />
  <title>Idea Forge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <main id="main-content" tabindex="-1">
    <h1>Idea Forge</h1>
    <p class="subtitle">Press <kbd>Enter</kbd> or click to generate ideas and project names</p>

    <section class="card" aria-labelledby="idea-heading">
      <h2 id="idea-heading">Project Idea</h2>
      <p id="idea" class="result" aria-live="polite" role="status">Click to generate an idea</p>
      <button id="ideaBtn" type="button" class="btn btn-primary" aria-controls="idea">Generate Idea</button>
    </section>

    <section class="card" aria-labelledby="name-heading">
      <h2 id="name-heading">Project Name</h2>
      <p id="name" class="result" aria-live="polite" role="status">Click to generate a name</p>
      <button id="nameBtn" type="button" class="btn btn-primary" aria-controls="name">Generate Name</button>
    </section>

    <footer class="footer">
      <p>Need both? <button id="bothBtn" type="button" class="btn btn-secondary" aria-label="Generate both idea and name">Generate Both</button></p>
    </footer>
    <section class="card" aria-labelledby="history-heading">
      <h2 id="history-heading">Saved Ideas</h2>
      <div class="history-controls">
        <button id="saveBtn" class="btn btn-primary">Save Current</button>
        <button id="clearBtn" class="btn btn-secondary">Clear History</button>
        <button id="exportBtn" class="btn">Export JSON</button>
        <label class="import-label">
          Import
          <input id="importInput" type="file" accept="application/json" />
        </label>
      </div>
      <ul id="historyList" class="history-list" aria-live="polite"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
